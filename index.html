<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="全球时事热点：左侧时间线，右侧地图" />
  <title>全球热点时间线</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>全球热点</h1>
          <p class="tagline">时间线 + 地图 · 来自 X 公开热点</p>
        </div>
      </div>
      <div class="header-meta">
        <span id="updated-at" class="updated">加载中…</span>
        <button type="button" id="theme-toggle" class="theme-btn" aria-label="切换主题">🌓</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="筛选">
      <div id="region-chips" class="chips" role="tablist"></div>
      <label class="search-wrap">
        <span class="sr-only">搜索</span>
        <input type="search" id="search" placeholder="搜索标题、地点或摘要…" autocomplete="off" />
      </label>
    </section>

    <p id="status" class="status" role="status"></p>

    <div class="split">
      <section class="split-list" aria-label="热点时间线">
        <ol id="timeline" class="timeline"></ol>
      </section>
      <aside class="split-map" aria-label="热点地图">
        <div class="map-sticky">
          <div id="map" class="map"></div>
          <p class="map-hint muted">点击卡片可定位地图标记；点击标记可跳到对应卡片。</p>
        </div>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>数据来自 <code>data/hotspots.json</code> · 地图：Leaflet + OpenStreetMap · GitHub Pages</p>
      <p class="muted">时区：Asia/Shanghai（北京时间）· 仅作公开热点汇总，细节可能变化</p>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
